<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A5A66;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toothGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F4F7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="150" cy="100" r="95" fill="#F0F8FA" stroke="#2E7D8C" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Elephant Trunk (curved, forming a tooth-like shape) -->
  <g id="trunk">
    <!-- Main trunk curve -->
    <path d="M 150 40 Q 130 60 125 85 Q 120 110 130 130 Q 145 145 160 135 Q 170 125 172 100 Q 173 70 150 40" 
          fill="url(#trunkGradient)" stroke="#1A5A66" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Trunk highlight (inner curve) -->
    <path d="M 152 48 Q 138 65 135 85 Q 132 105 140 125 Q 150 135 160 128 Q 168 118 169 95 Q 169 70 152 48" 
          fill="#4A9FB8" opacity="0.6"/>
    
    <!-- Elephant eye -->
    <circle cx="135" cy="65" r="4" fill="#1A5A66"/>
    <circle cx="136" cy="64" r="1.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Teeth (dental representation) -->
  <g id="teeth">
    <!-- Right tooth -->
    <g filter="url(#shadow)">
      <path d="M 165 100 L 175 85 L 180 110 L 172 120 Z" 
            fill="url(#toothGradient)" stroke="#A0D8E8" stroke-width="1.5"/>
      <path d="M 168 105 L 176 92 L 178 108 L 171 115 Z" 
            fill="#F5FFFE" opacity="0.8"/>
    </g>
    
    <!-- Center top tooth -->
    <g filter="url(#shadow)">
      <path d="M 150 50 L 158 40 L 165 70 L 152 75 Z" 
            fill="url(#toothGradient)" stroke="#A0D8E8" stroke-width="1.5"/>
      <path d="M 152 58 L 160 45 L 163 65 L 154 70 Z" 
            fill="#F5FFFE" opacity="0.8"/>
    </g>
    
    <!-- Left tooth -->
    <g filter="url(#shadow)">
      <path d="M 135 100 L 125 85 L 120 110 L 128 120 Z" 
            fill="url(#toothGradient)" stroke="#A0D8E8" stroke-width="1.5"/>
      <path d="M 132 105 L 124 92 L 122 108 L 129 115 Z" 
            fill="#F5FFFE" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Accent circles (representing professionalism and completeness) -->
  <circle cx="150" cy="100" r="3" fill="#2E7D8C"/>
  <circle cx="120" cy="150" r="2" fill="#4A9FB8" opacity="0.7"/>
  <circle cx="180" cy="150" r="2" fill="#4A9FB8" opacity="0.7"/>
  
  <!-- Text: Dentaesthetics -->
  <text x="150" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" 
        text-anchor="middle" fill="#1A5A66" letter-spacing="1">DENTAESTHETICS</text>
  
  <!-- Tagline -->
  <text x="150" y="232" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-style="italic"
        text-anchor="middle" fill="#2E7D8C" letter-spacing="0.5">THE DENTAL COMPANY</text>
  
  <!-- Decorative accent line -->
  <line x1="110" y1="240" x2="190" y2="240" stroke="#2E7D8C" stroke-width="2" opacity="0.5"/>
  
  <!-- Small tagline: Nature of Elegance -->
  <text x="150" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="9"
        text-anchor="middle" fill="#4A9FB8" letter-spacing="0.3" opacity="0.8">Nature of Elegance</text>
</svg>