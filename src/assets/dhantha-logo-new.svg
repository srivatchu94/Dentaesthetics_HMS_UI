<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#134e4a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="teethGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.4" flood-color="#000000"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Circle -->
  <circle cx="150" cy="150" r="145" fill="#1a1f2e" stroke="#0d9488" stroke-width="3" filter="url(#dropShadow)"/>

  <!-- Protective Shield Outline (Trust & Protection) -->
  <path d="M 150 85 L 175 105 L 175 155 Q 150 190 150 190 Q 150 190 125 155 L 125 105 Z" 
        fill="none" stroke="url(#shieldGradient)" stroke-width="2.5" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Elephant Trunk (curved, protective - DARK TEAL) -->
  <path d="M 130 140 Q 105 125, 85 140 Q 75 150, 85 170 Q 105 180, 125 170" 
        fill="none" stroke="url(#trunkGradient)" stroke-width="14" stroke-linecap="round" 
        filter="url(#dropShadow)" stroke-linejoin="round"/>

  <!-- Trunk Highlight -->
  <path d="M 130 138 Q 108 124, 88 138" 
        fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- Trunk Eye (represents wisdom) - BRIGHT CYAN -->
  <circle cx="100" cy="135" r="4" fill="#00d4ff" filter="url(#dropShadow)"/>
  <circle cx="101" cy="134" r="1.5" fill="#ffffff" opacity="0.8"/>

  <!-- Main Tooth (Center - Larger, represents strength & trust) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="150" cy="135" rx="20" ry="38" fill="url(#teethGradient)" stroke="#d1fae5" stroke-width="2"/>
    <!-- Tooth shine - bright -->
    <ellipse cx="144" cy="115" rx="8" ry="15" fill="#ffffff" opacity="0.8"/>
    <!-- Tooth centerline -->
    <line x1="150" y1="158" x2="150" y2="173" stroke="#a7f3d0" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Left Tooth (represents care) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="110" cy="152" rx="15" ry="30" fill="url(#teethGradient)" stroke="#d1fae5" stroke-width="1.5" transform="rotate(-25 110 152)"/>
    <!-- Tooth shine -->
    <ellipse cx="106" cy="132" rx="6" ry="12" fill="#ffffff" opacity="0.7" transform="rotate(-25 106 132)"/>
  </g>

  <!-- Right Tooth (represents accessibility) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="190" cy="152" rx="15" ry="30" fill="url(#teethGradient)" stroke="#d1fae5" stroke-width="1.5" transform="rotate(25 190 152)"/>
    <!-- Tooth shine -->
    <ellipse cx="194" cy="132" rx="6" ry="12" fill="#ffffff" opacity="0.7" transform="rotate(25 194 132)"/>
  </g>

  <!-- Protective Arc (Ethics symbol) - BRIGHT CYAN -->
  <path d="M 95 200 Q 150 235, 205 200" 
        fill="none" stroke="#06b6d4" stroke-width="3" 
        stroke-linecap="round" opacity="0.9" filter="url(#dropShadow)"/>

  <!-- Heart inside (Core value - Care and compassion) - ACCENT COLOR -->
  <g transform="translate(150, 195)" filter="url(#dropShadow)">
    <path d="M 0,-7 C -5,-12 -12,-12 -12,-5 C -12,0 -7,5 0,8 C 7,5 12,0 12,-5 C 12,-12 5,-12 0,-7 Z" 
          fill="#06b6d4" opacity="0.9"/>
  </g>

  <!-- Ethical Growth Branch Left - BRIGHT ACCENT -->
  <g opacity="0.8">
    <path d="M 60 245 Q 75 220, 90 205" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#dropShadow)"/>
    <circle cx="65" cy="240" r="2.5" fill="#00d4ff"/>
    <circle cx="85" cy="208" r="2.5" fill="#00d4ff"/>
  </g>

  <!-- Ethical Growth Branch Right - BRIGHT ACCENT -->
  <g opacity="0.8">
    <path d="M 240 245 Q 225 220, 210 205" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#dropShadow)"/>
    <circle cx="235" cy="240" r="2.5" fill="#00d4ff"/>
    <circle cx="215" cy="208" r="2.5" fill="#00d4ff"/>
  </g>

  <!-- Trust Dots (representing transparency) - BRIGHT CYAN -->
  <g filter="url(#dropShadow)">
    <circle cx="125" cy="95" r="3" fill="#00d4ff" opacity="0.9"/>
    <circle cx="175" cy="95" r="3" fill="#00d4ff" opacity="0.9"/>
    <circle cx="150" cy="75" r="3" fill="#06b6d4" opacity="0.9"/>
  </g>

  <!-- Border accent - DOUBLE BORDER -->
  <circle cx="150" cy="150" r="148" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
  <circle cx="150" cy="150" r="142" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>

</svg>