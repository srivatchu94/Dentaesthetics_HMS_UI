<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="teethGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fdf4;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3" flood-color="#000000"/>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="150" cy="150" r="145" fill="#f0fdf4" stroke="#2dd4bf" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Protective Shield (Trust & Protection) -->
  <path d="M 150 80 L 180 100 L 180 150 Q 150 190 150 190 Q 150 190 120 150 L 120 100 Z" 
        fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Elephant Trunk (curved, protecting teeth) -->
  <path d="M 130 140 Q 110 130, 95 145 Q 85 155, 90 170 Q 100 175, 115 165" 
        fill="none" stroke="url(#trunkGradient)" stroke-width="12" stroke-linecap="round" 
        filter="url(#dropShadow)" opacity="0.95"/>

  <!-- Trunk Eye (represents wisdom) -->
  <circle cx="105" cy="142" r="3" fill="#0d9488"/>

  <!-- Main Tooth (Center - Larger, represents strength & trust) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="150" cy="140" rx="18" ry="35" fill="url(#teethGradient)" stroke="#e0f2fe" stroke-width="1.5"/>
    <!-- Tooth shine -->
    <ellipse cx="145" cy="120" rx="6" ry="12" fill="#ffffff" opacity="0.6"/>
    <!-- Tooth line -->
    <line x1="150" y1="155" x2="150" y2="175" stroke="#d1fae5" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Left Tooth (represents care) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="115" cy="155" rx="14" ry="28" fill="url(#teethGradient)" stroke="#e0f2fe" stroke-width="1.5" transform="rotate(-20 115 155)"/>
    <!-- Tooth shine -->
    <ellipse cx="112" cy="138" rx="5" ry="10" fill="#ffffff" opacity="0.5" transform="rotate(-20 112 138)"/>
  </g>

  <!-- Right Tooth (represents accessibility) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="185" cy="155" rx="14" ry="28" fill="url(#teethGradient)" stroke="#e0f2fe" stroke-width="1.5" transform="rotate(20 185 155)"/>
    <!-- Tooth shine -->
    <ellipse cx="188" cy="138" rx="5" ry="10" fill="#ffffff" opacity="0.5" transform="rotate(20 188 138)"/>
  </g>

  <!-- Protective Hand/Arc (Ethics symbol) -->
  <path d="M 100 200 Q 150 230, 200 200" 
        fill="none" stroke="url(#heartGradient)" stroke-width="2.5" 
        stroke-linecap="round" opacity="0.6"/>

  <!-- Heart inside (Core value - Care and compassion) -->
  <g transform="translate(150, 195)">
    <path d="M 0,-8 C -6,-14 -14,-14 -14,-6 C -14,0 -8,6 0,10 C 8,6 14,0 14,-6 C 14,-14 6,-14 0,-8 Z" 
          fill="#00d4ff" opacity="0.4" filter="url(#glow)"/>
  </g>

  <!-- Branch/Ethical Path (representing growth with ethics) -->
  <g opacity="0.3">
    <path d="M 60 240 Q 70 220, 80 210" stroke="#2dd4bf" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 80 210 Q 90 200, 100 195" stroke="#2dd4bf" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <circle cx="65" cy="235" r="2" fill="#2dd4bf"/>
    <circle cx="90" cy="210" r="2" fill="#2dd4bf"/>
  </g>

  <!-- Branch on right side -->
  <g opacity="0.3">
    <path d="M 240 240 Q 230 220, 220 210" stroke="#2dd4bf" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 220 210 Q 210 200, 200 195" stroke="#2dd4bf" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <circle cx="235" cy="235" r="2" fill="#2dd4bf"/>
    <circle cx="210" cy="210" r="2" fill="#2dd4bf"/>
  </g>

  <!-- Trust Dots (representing transparency) -->
  <circle cx="130" cy="100" r="2.5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="170" cy="100" r="2.5" fill="#00d4ff" opacity="0.6"/>
  <circle cx="150" cy="85" r="2.5" fill="#00d4ff" opacity="0.6"/>

  <!-- Border accent -->
  <circle cx="150" cy="150" r="148" fill="none" stroke="url(#trunkGradient)" stroke-width="0.5" opacity="0.3"/>
</svg>